# MineColonies is large: 2060 source files, 306k lines. 3G is the floor here.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Pins verified across five 26.2 ports — see PORTING-BUNDLE-26.2.md §3.
# There is deliberately no `mappings` line: 26.1+ ships unobfuscated.
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.160.5+26.3
loom_version=1.17.19

# Mod properties. Version carried over from the upstream 1.21.1 snapshot.
mod_id=minecolonies
mod_version=0.0.84
maven_group=com.ldtteam
archives_base_name=minecolonies-26.3

# Ported ldtteam libraries, built from their sources in `libs/` in this repository.
# BlockUI also supplies com.ldtteam.common (network + config), so it is required.
blockui_jar=../libs/blockui/26.3/build/libs/blockui-0.0.2.jar
domum_jar=../libs/domum-ornamentum/26.3/build/libs/domum_ornamentum-26.3-1.0.1.jar
structurize_jar=../libs/structurize/26.3/build/libs/structurize-26.3-1.0.2.jar
worldmap_jar=../worldmap/26.3/build/libs/worldmap-26.3-0.1.6.jar

# Optional aircraft integration. Compile-only: the jar is never bundled (it is a separate mod the
# player installs, and its LGPL-3.0-or-later terms are satisfied by linking, not by shipping a copy).
#
# The `*` is deliberate and build.gradle expands it to the newest matching jar. The aircraft mod is
# versioned independently of this one, so a path naming a version goes stale the moment it is rebuilt,
# and the failure that produces is not the friendly one -- build.gradle checks the path at
# configuration time, so a jar that disappears mid-build reaches javac as NoSuchFileException.
#
# If nothing matches, build.gradle says so and excludes the compat sources. Note that this does NOT
# currently give a green build: seven references reach into that package from outside it. See the
# comment on the exclusion in build.gradle.
simpleplanes_jar=/home/user/unknown-wq/simple-planes/dist/simpleplanes-26.3-*.jar
