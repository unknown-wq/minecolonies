# MineColonies is large: 2060 source files, 306k lines. 3G is the floor here.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Pins verified across five 26.2 ports — see PORTING-BUNDLE-26.2.md §3.
# There is deliberately no `mappings` line: 26.1+ ships unobfuscated.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.154.2+26.2
loom_version=1.17.13

# Mod properties. Version carried over from the upstream 1.21.1 snapshot.
mod_id=minecolonies
mod_version=0.0.65
maven_group=com.ldtteam
archives_base_name=minecolonies-26.2

# Ported ldtteam libraries, built from their sources in `libs/` in this repository.
# BlockUI also supplies com.ldtteam.common (network + config), so it is required.
blockui_jar=../libs/blockui/26.2/build/libs/blockui-0.0.1.jar
domum_jar=../libs/domum-ornamentum/26.2/build/libs/domum_ornamentum-26.2-1.0.0.jar
structurize_jar=../libs/structurize/26.2/build/libs/structurize-26.2-1.0.0.jar

# Optional aircraft integration. Compile-only: the jar is never bundled (it is a separate mod the
# player installs, and its LGPL-3.0-or-later terms are satisfied by linking, not by shipping a copy).
# If this path does not exist the build still succeeds -- build.gradle adds the compat sources to the
# optional-integrations exclusion list instead, and the mod runs with the no-aircraft fallback.
simpleplanes_jar=/home/user/unknown-wq/simple-planes/dist/simpleplanes-26.2-5.3.10.jar
