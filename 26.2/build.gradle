plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// The three ldtteam libraries are built from their own repositories in /workspace and are not published
// anywhere, so they arrive as bare jar paths. Loom's `include` (Jar-in-Jar) refuses a bare file --
// "not a module component and has no capabilities" -- it needs a resolvable module. So the jars are
// staged into a throwaway Maven layout with a minimal pom each, and referred to by coordinate from
// there. This has to happen at configuration time: repositories are resolved before any task runs.
//
// Deliberately NOT under build/: `clean` wipes that directory *after* configuration has already staged
// into it, and configuration does not run again before the build resolves -- so `clean build` would
// resolve nothing and fail with 2000 "package does not exist" errors.
def stagedLibs = layout.projectDirectory.dir(".staged-libs").asFile
def stageLib = { String group, String name, String version, String jarPath ->
	final File jar = file(jarPath)
	if (!jar.exists()) {
		throw new GradleException("Dependency jar is missing: ${jarPath}\n" +
			"Build it in its own repository first -- see gradle.properties for the expected paths.")
	}
	final File dir = new File(stagedLibs, "${group.replace('.', '/')}/${name}/${version}")
	dir.mkdirs()
	final File staged = new File(dir, "${name}-${version}.jar")
	if (!staged.exists() || staged.lastModified() < jar.lastModified()) {
		staged.bytes = jar.bytes
	}
	new File(dir, "${name}-${version}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${group}</groupId>
  <artifactId>${name}</artifactId>
  <version>${version}</version>
  <packaging>jar</packaging>
</project>
"""
	return "${group}:${name}:${version}"
}

ext.blockuiCoords = stageLib("com.ldtteam", "blockui", "0.0.1", project.blockui_jar)
ext.domumCoords = stageLib("com.ldtteam", "domum_ornamentum", "26.2-1.0.0", project.domum_jar)
ext.structurizeCoords = stageLib("com.ldtteam", "structurize", "26.2-1.0.0", project.structurize_jar)

repositories {
	maven {
		name = "stagedLibs"
		url = stagedLibs.toURI()
		metadataSources {
			mavenPom()
			artifact()
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/minecolonies.accesswidener")
}

// Registers the `runDatagen` task and mounts src/main/generated. `client = true` because
// DefaultItemModelProvider and DefaultEntityIconProvider are client-side providers (item models and
// the citizen face icons); the whole datagen runs from the single `fabric-datagen` entrypoint,
// com.minecolonies.core.generation.MineColoniesDataGenerator.
fabricApi {
	configureDataGeneration {
		client = true
		// Without this, runDatagen runs the data generators of every mod on the classpath -- BlockUI, Domum
		// Ornamentum and Structurize are plain `implementation files(...)` jars, so Fabric sees three more
		// fabric-datagen entrypoints and runs them into *our* output directory. They then fight over it: each
		// run's HashCache deletes the files that run did not write, so the contents changed on every
		// invocation and a clean run produced someone else's assets.
		modId = project.mod_id
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.1+ is unobfuscated and Yarn is discontinued: no mappings line is needed.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The three ported ldtteam libraries, built from their own repos in /workspace.
	// BlockUI is not optional GUI: it also carries com.ldtteam.common, which is where the
	// mod's network and config layers live. Structurize landed on 2026-07-31 and replaced
	// the compile-only stubs that had been standing in for it.
	// Plain `implementation`, not `modImplementation`: 26.1+ is unobfuscated, so there is
	// nothing to remap, and this Loom does not expose the remapping configurations.
	implementation blockuiCoords
	implementation domumCoords
	implementation structurizeCoords

	// ...and nested into the output jar as well, so a single file is installable.
	//
	// None of the three is published to a Maven repository, so a player cannot be asked to go and find
	// them. Fabric's Jar-in-Jar puts them under META-INF/jars/ and the loader picks them up as ordinary
	// mods -- each already carries a valid fabric.mod.json with its own id, version and depends block,
	// which is the only requirement. Nothing is remapped on the way in: 26.1+ is unobfuscated and these
	// jars are already final.
	//
	// fabric-api is deliberately NOT nested: it is a platform, every installation has it, and bundling
	// a copy of it is how you end up with two versions loaded.
	include blockuiCoords
	include domumCoords
	include structurizeCoords

	// Simple Planes, if it is available to build against. compileOnly and NOT `include`, for two
	// separate reasons that happen to agree:
	//
	//  - It is an optional integration. Everything that names a xyz.przemyk type lives in
	//    com/minecolonies/core/compatibility/simpleplanes/, is reached only through the
	//    AircraftCompat proxy, and is installed only behind FabricLoader.isModLoaded("simpleplanes").
	//    Nothing in the mod loads one of those classes when the aircraft mod is absent, so the
	//    classes may safely be missing at runtime.
	//  - Simple Planes is LGPL-3.0-or-later and MineColonies is GPL-3.0-only. Linking against it is
	//    fine in that direction; bundling a copy of it inside this jar is a redistribution with its
	//    own obligations and there is no reason to take them on -- it is a separate mod the player
	//    installs.
	if (rootProject.hasProperty('simpleplanes_jar') && file(simpleplanes_jar).exists()) {
		compileOnly files(simpleplanes_jar)
	}
}

// JEI and JourneyMap are parked, not deleted: 3826 lines in 25 files that compile
// against APIs we do not need to get the mod running. The cut is clean -- nothing
// outside those two packages references them, and Compatibility.jeiProxy already
// defaults to a no-op IJeiProxy. Delete a line from optional-integrations.txt to
// bring a file back.
def parkedIntegrations = file("optional-integrations.txt")
if (parkedIntegrations.exists()) {
	sourceSets.main.java {
		parkedIntegrations.readLines()
			.findAll { !it.trim().isEmpty() && !it.startsWith("#") }
			.each { exclude it.trim() }
	}
}

// The aircraft compat package is the one optional integration whose exclusion is decided by the build
// rather than written down in optional-integrations.txt, because the answer depends on whether the jar
// to compile it against is actually on this machine. With Simple Planes present it compiles; without
// it, it is dropped exactly as JEI and JourneyMap are, and Compatibility.aircraftCompat keeps its
// no-aircraft default. Either way the build is green and the mod runs.
if (!rootProject.hasProperty('simpleplanes_jar') || !file(simpleplanes_jar).exists()) {
	logger.lifecycle("Simple Planes jar not found -- building without the aircraft integration.")
	sourceSets.main.java {
		exclude 'com/minecolonies/core/compatibility/simpleplanes/**'
	}
}

// NOTE: there is deliberately NO exclusion for the 147 Structurize-blocked files.
// Excluding them was tried and abandoned early on: IBuilding, IBuildingView,
// AbstractBuilding, AbstractBlockHut, Colony and BlockPosUtil all live in that set, so
// dropping it turned 147 blocked files into 856 broken ones. They compile like everything
// else — now against the real library. structurize-blocked.txt survives only as the grep
// list of files to re-check against the real API; this build never reads it.

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	// src/main/resources and src/main/generated are both resource roots and they genuinely overlap, because
	// some authored files are datagen *input* as well as being resources. The quests are the case that matters:
	// src/main/resources holds the authoring copy with literal English text, QuestTranslationProvider reads it,
	// lifts the strings into lang/quests.json and writes the shipping copy -- with translation keys instead of
	// text -- to src/main/generated at the same path. The generated copy is the one that must ship, so it has to
	// win; deleting the authored copy instead is not an option, since that is what the provider reads (do it and
	// the provider consumes its own output and every quest string becomes its own key).
	//
	// Loom mounts src/main/generated after src/main/resources, so "last one wins" is the generated one.
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	// 5000 is not paranoia: the first compile of a 2060-file mod overflows javac's
	// default 100-error cap long before it reaches anything informative.
	it.options.compilerArgs += ["-Xmaxerrs", "5000", "-Xmaxwarns", "0"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// ---------------------------------------------------------------------------
// Datagen output guard.
//
// src/main/generated is mounted as a second resource root, and only half of it is in
// git: generated/data and generated/.cache are committed, generated/assets is ignored
// (see .gitignore) and has to be recreated by runDatagen in every fresh checkout.
// Nothing used to verify that this had happened. A `build` in a tree where runDatagen
// had never run produced a perfectly ordinary, perfectly quiet jar that was simply
// missing the 235 generated item models -- so every item in the game rendered as the
// missing-texture checkerboard. Three releases went out that way before anyone
// unpacked a jar and counted.
//
// No hand-maintained list of expected files is needed, and no magic file counts are
// hard-coded here. Minecraft's own HashCache manifests under src/main/generated/.cache
// are committed, and every non-comment line in them is "<sha1> <path>" for one file the
// generators produce. That is the contract: each of those paths must exist on disk
// before a jar is assembled, and must be present inside the finished jar afterwards.
// When a generator is added or removed, the committed manifests move with it and the
// check follows along on its own.
// ---------------------------------------------------------------------------

def generatedDir = file("src/main/generated")

// Reads every committed HashCache manifest and returns the set of paths, relative to
// src/main/generated, that runDatagen is expected to have written.
def readDatagenManifest = { ->
	final File cacheDir = new File(generatedDir, ".cache")
	if (!cacheDir.isDirectory()) {
		throw new GradleException(
			"Datagen guard: ${cacheDir} is missing, so there is nothing to check the build against.\n" +
			"src/main/generated/.cache is committed to this repository -- restore it from git " +
			"(git checkout -- src/main/generated/.cache) and run:\n" +
			"    tools/mc-build.sh ${projectDir} runDatagen")
	}
	final Set<String> expected = new TreeSet<String>()
	cacheDir.listFiles()?.sort { it.name }?.each { File manifest ->
		if (!manifest.isFile()) {
			return
		}
		manifest.eachLine("UTF-8") { String rawLine ->
			final String line = rawLine.trim()
			if (line.isEmpty() || line.startsWith("//")) {
				return
			}
			final int sep = line.indexOf(' ')
			if (sep > 0) {
				expected.add(line.substring(sep + 1).trim())
			}
		}
	}
	if (expected.isEmpty()) {
		throw new GradleException(
			"Datagen guard: the HashCache manifests in ${cacheDir} list no files at all.\n" +
			"They are committed and should never be empty; restore them from git and re-run runDatagen.")
	}
	if (expected.every { !it.startsWith("assets/") }) {
		throw new GradleException(
			"Datagen guard: the HashCache manifests in ${cacheDir} name no assets/ files.\n" +
			"The client-side providers (item models, entity icons, lang) write under assets/, so a\n" +
			"manifest set without them is truncated and cannot be used to verify this build.\n" +
			"Restore src/main/generated/.cache from git and re-run runDatagen.")
	}
	return expected
}

// A short, readable sample of what is missing -- the full list is 300+ lines when the
// assets half of the tree is absent, which is the usual case.
def sampleOf = { Collection<String> paths, int limit ->
	final List<String> sorted = new ArrayList<String>(paths).sort()
	final StringBuilder sb = new StringBuilder()
	sorted.take(limit).each { sb.append("    ").append(it).append('\n') }
	if (sorted.size() > limit) {
		sb.append("    ... and ").append(sorted.size() - limit).append(" more\n")
	}
	return sb.toString()
}

// Groups missing paths by their top two directory levels, so the message says
// "assets/minecolonies/items: 235 missing" rather than listing them one by one.
def summariseByDir = { Collection<String> paths ->
	final Map<String, Integer> counts = new TreeMap<String, Integer>()
	paths.each { String p ->
		final String[] parts = p.split('/')
		final String key = parts.length >= 3 ? "${parts[0]}/${parts[1]}/${parts[2]}" : p
		counts.put(key, (counts.get(key) ?: 0) + 1)
	}
	final StringBuilder sb = new StringBuilder()
	counts.sort { -it.value }.each { k, v -> sb.append("    ").append(k).append(": ").append(v).append(" missing\n") }
	return sb.toString()
}

def verifyDatagenOutput = tasks.register("verifyDatagenOutput") {
	group = "verification"
	description = "Fails the build when runDatagen's output is missing from src/main/generated."
	// Never cached, never skipped: the whole point is to look at the tree as it is right now.
	outputs.upToDateWhen { false }
	doLast {
		final Set<String> expected = readDatagenManifest()
		final Set<String> missing = new TreeSet<String>()
		expected.each { String rel ->
			if (!new File(generatedDir, rel).isFile()) {
				missing.add(rel)
			}
		}
		if (!missing.isEmpty()) {
			throw new GradleException(
				"Datagen output is missing: ${missing.size()} of ${expected.size()} generated files are not on disk.\n" +
				"\n" +
				summariseByDir(missing) +
				"\n" +
				"First few:\n" +
				sampleOf(missing, 10) +
				"\n" +
				"src/main/generated/assets is not stored in git and is rebuilt per checkout, so this is\n" +
				"what a tree looks like when runDatagen has not been run in it. Building now would\n" +
				"produce a jar without those files and every affected item would render untextured.\n" +
				"\n" +
				"Run the generators first, as their own separate invocation:\n" +
				"    tools/mc-build.sh ${projectDir} runDatagen\n" +
				"and only then:\n" +
				"    tools/mc-build.sh ${projectDir} build")
		}
		logger.lifecycle("Datagen guard: all ${expected.size()} generated files present in src/main/generated.")
	}
}

// Assembling a jar is what must not happen with the generated tree half empty, so the
// guard hangs off `jar` -- which is upstream of assemble, build and publish alike, and
// is not on runDatagen's own path, so the generators can still be run in a tree that
// does not pass the check yet.
tasks.named("jar") {
	dependsOn verifyDatagenOutput
}

// Ordering only, no dependency: when a jar is being built, say so before spending five
// minutes compiling 2060 files that are then thrown away. Ignored when the guard is not
// in the graph at all, as for a bare `compileJava`.
tasks.named("compileJava") {
	mustRunAfter verifyDatagenOutput
}

// ...and the same manifest is checked once more against the finished artifact. The
// disk check above cannot see a resource root that failed to mount or a filter that
// dropped the files on the way in; this one looks at what a player would actually
// install. A jar that fails here is deleted, so a red build cannot leave a shippable
// file lying in build/libs.
def verifyJarContents = { File archive ->
	final Set<String> expected = readDatagenManifest()
	final Set<String> present = new HashSet<String>()
	new java.util.zip.ZipFile(archive).withCloseable { zip ->
		zip.entries().each { entry ->
			if (!entry.isDirectory()) {
				present.add(entry.name)
			}
		}
	}
	final Set<String> missing = new TreeSet<String>(expected.findAll { !present.contains(it) })
	if (!missing.isEmpty()) {
		archive.delete()
		throw new GradleException(
			"Generated files are missing from ${archive.name}: ${missing.size()} of ${expected.size()}.\n" +
			"\n" +
			summariseByDir(missing) +
			"\n" +
			"First few:\n" +
			sampleOf(missing, 10) +
			"\n" +
			"src/main/generated is a resource root and everything runDatagen writes there belongs in\n" +
			"the jar. The jar has been deleted rather than left behind to be shipped by mistake.\n" +
			"Re-run the generators and build again, as two separate invocations:\n" +
			"    tools/mc-build.sh ${projectDir} runDatagen\n" +
			"    tools/mc-build.sh ${projectDir} build")
	}
	logger.lifecycle("Datagen guard: ${archive.name} carries all ${expected.size()} generated files.")
}

// 26.1+ is unobfuscated, so this Loom registers no remapJar and `jar` is the artifact
// that ships; the name is matched rather than resolved so that the check follows the
// final jar by itself should a remapping step ever come back.
tasks.matching { it.name == "jar" || it.name == "remapJar" }.configureEach {
	doLast {
		verifyJarContents(archiveFile.get().asFile)
	}
}
