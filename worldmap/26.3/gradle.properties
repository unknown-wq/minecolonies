# Small mod, small heap.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Pins match ../../26.3/gradle.properties exactly -- one Loom cache is shared by every project in
# this checkout, and pulling in a second Minecraft version would double it for no reason.
# There is deliberately no `mappings` line: 26.1+ ships unobfuscated.
minecraft_version=26.3-pre-2
loader_version=0.19.5
fabric_version=0.159.4+26.3
loom_version=1.17.19

# Mod properties.
mod_id=worldmap
mod_version=0.1.6
maven_group=com.unknownwq
archives_base_name=worldmap-26.3
